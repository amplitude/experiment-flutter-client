name: amplitude_experiment
description: "The official Amplitude Experiment Flutter SDK for feature flags and experimentation across iOS, Android, and Web."
version: 0.1.0-beta.3 # x-release-please-version
homepage: "https://amplitude.com/docs/experiment-home"
repository: "https://github.com/amplitude/experiment-flutter-client"
issue_tracker: "https://github.com/amplitude/experiment-flutter-client/issues"
topics:
  - experiment
  - feature-flags
  - ab-testing
  - amplitude

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.1.7

flutter:
  plugin:
    platforms:
      android:
        package: com.amplitude.experiment.flutter
        pluginClass: AmplitudeExperimentPlugin
      ios:
        pluginClass: AmplitudeExperimentPlugin
      web: 
        pluginClass: ExperimentWebPlugin
        fileName: src/experiment_web_plugin.dart
